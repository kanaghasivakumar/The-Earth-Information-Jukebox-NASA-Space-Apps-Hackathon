[project]
name = "nasa-space-apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.0",
    "google-genai>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "opencv-python>=5.0.0.93",
    "pillow>=11.0",
    "pretty-midi>=0.2.11.post0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["eic-vae/tests"]
pythonpath = ["eic-vae"]
